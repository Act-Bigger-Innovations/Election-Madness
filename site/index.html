<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Election Madness 2028</title>
<meta name="description" content="A March Madness-style bracket of 2028 presidential contenders. One vote per matchup, one week per round. The public decides who advances.">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--panel:#121a30;--panel2:#18223d;--line:#24304f;
  --ink:#f2f4fa;--ink2:#aab3cc;--ink3:#6c7799;
  --blue:#3b82f6;--blue2:#1d4ed8;--red:#ef4444;--red2:#b91c1c;--gold:#f5c542;--green:#22c55e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:60px;gap:8px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.mark{font:800 20px/1 Outfit,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.mark b{color:var(--gold);font-weight:800}
nav{display:flex;gap:4px}
nav a{padding:8px 12px;border-radius:999px;font:600 12px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
nav a.on{background:var(--panel2);color:var(--ink)}
@media(max-width:560px){.mark{font-size:17px}nav a{padding:7px 8px;font-size:11px}}
main{padding:24px 0 80px}
h1{font:800 clamp(34px,6vw,56px)/1.02 Outfit;letter-spacing:-.02em;margin:0 0 8px}
h2{font:700 22px/1.1 Outfit;margin:28px 0 12px;letter-spacing:-.01em}
.lbl{font:600 11px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.sub{color:var(--ink2);max-width:640px;margin:0 0 20px}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:600 12px/1 Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:18px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.status.closed i{background:var(--ink3);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.match .hd{display:flex;justify-content:space-between;align-items:center}
.match .hd .lbl.blue{color:var(--blue)} .match .hd .lbl.red{color:var(--red)}
.cand{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;text-align:left;width:100%;transition:transform .08s,border-color .15s}
.cand:hover{border-color:var(--line)}
.cand:active{transform:scale(.985)}
.cand .seed{font:700 15px/1 Outfit;color:var(--ink3);text-align:center}
.cand .nm{font:600 16px/1.15 Outfit}
.cand .tt{font:400 12px/1.2 Inter;color:var(--ink3);margin-top:2px}
.cand .pct{font:700 18px/1 Outfit;min-width:48px;text-align:right}
.cand.mine{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cand.win .nm{color:var(--gold)}
.cand[disabled]{cursor:default}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar b{display:block;height:100%}
.bar.blue b{background:var(--blue)} .bar.red b{background:var(--red)}
.meta{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px}
.note{color:var(--ink3);font-size:13px}
.round{margin-bottom:26px}
.round .rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.round .rh h2{margin:0}
.empty{padding:40px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 13px Inter;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.how p{max-width:640px;color:var(--ink2)}
.how ol{max-width:640px;color:var(--ink2);padding-left:20px}
.how li{margin:6px 0}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--ink3);font-size:12px}
footer a{color:var(--ink2)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 22px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font:800 28px/1 Outfit;margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap top">
  <a class="mark" href="#now">ELECTION <b>MADNESS</b> 2028</a>
  <nav>
    <a href="#now" data-r="now">Vote</a>
    <a href="#bracket" data-r="bracket">Bracket</a>
    <a href="#results" data-r="results">Results</a>
    <a href="#how" data-r="how">How</a>
  </nav>
</div></header>
<main class="wrap" id="main"><div class="empty">Loading the field</div></main>
<footer><div class="wrap">A hypothetical bracket until candidates declare. One vote per matchup per device. Follow <a href="https://instagram.com/ElectionMadness28" rel="noopener">@ElectionMadness28</a> for the weekly results show.</div></footer>
<div class="toast" id="toast"></div>
<script>
// Election Madness 2028 client. Reads public tables with the anon key; the only write is
// one vote row per matchup per voter, enforced by the database policy (em_vote_ok).
const SB = window.EM_SUPABASE_URL || 'https://hbpurggayqtjshwlwmet.supabase.co';
const KEY = window.EM_SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhicHVyZ2dheXF0anNod2x3bWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTc1MjksImV4cCI6MjA5Njc5MzUyOX0.06N-pFLMtJNRkfB45pgSMtlc61NPy1EkVD-QADTJl6I';
const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function voterId() {
  try {
    let v = localStorage.getItem('em_voter');
    if (!v) { v = crypto.randomUUID().replace(/-/g, ''); localStorage.setItem('em_voter', v); }
    return v;
  } catch { return (window.__emVoter ||= crypto.randomUUID().replace(/-/g, '')); }
}
function myVotes() { try { return JSON.parse(localStorage.getItem('em_votes') || '{}'); } catch { return {}; } }
function remember(m, c) { const v = myVotes(); v[m] = c; try { localStorage.setItem('em_votes', JSON.stringify(v)); } catch {} }

async function get(path) {
  const r = await fetch(SB + '/rest/v1/' + path, { headers: H });
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}
let D = null;
async function load() {
  const [cands, rounds, matchups, tallies] = await Promise.all([
    get('em_candidates?select=*&order=party,seed'),
    get('em_rounds?select=*&order=sort'),
    get('em_matchups?select=*&order=sort'),
    get('em_tallies?select=*'),
  ]);
  const C = Object.fromEntries(cands.map(c => [c.id, c]));
  const T = Object.fromEntries(tallies.map(t => [t.matchup_id, t]));
  const now = Date.now();
  for (const r of rounds) {
    r.open = now >= Date.parse(r.opens_at) && now <= Date.parse(r.closes_at);
    r.past = now > Date.parse(r.closes_at);
    r.matchups = matchups.filter(m => m.round_id === r.id).map(m => ({ ...m, t: T[m.id] || { a_votes: 0, b_votes: 0 } }));
  }
  D = { C, rounds };
  return D;
}

const fmtDate = (s) => new Date(s).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', timeZone: 'America/Chicago' }) + ' CT';
function left(s) {
  const ms = Date.parse(s) - Date.now(); if (ms <= 0) return 'closed';
  const h = Math.floor(ms / 36e5); if (h >= 48) return Math.floor(h / 24) + ' days left';
  if (h >= 1) return h + ' hours left'; return Math.max(1, Math.floor(ms / 6e4)) + ' min left';
}

function matchCard(m, r) {
  const a = D.C[m.a_id], b = D.C[m.b_id];
  const av = +m.t.a_votes, bv = +m.t.b_votes, tot = av + bv;
  const pa = tot ? Math.round(av / tot * 100) : 50, pb = tot ? 100 - pa : 50;
  const mine = myVotes()[m.id];
  const decided = !!m.winner_id || r.past;
  const win = m.winner_id || (decided && tot ? (av >= bv ? a.id : b.id) : null);
  const party = a.party;
  const cand = (c, v, p) => `<button class="cand ${mine === c.id ? 'mine' : ''} ${win === c.id ? 'win' : ''}" data-m="${m.id}" data-c="${c.id}" ${(!r.open || mine || decided) ? 'disabled' : ''}>
      <span class="seed">${c.seed ?? ''}</span>
      <span><div class="nm">${esc(c.name)}</div><div class="tt">${esc(c.title || '')}${c.status === 'locked' ? ' · Locked in' : c.status === 'out' ? ' · Out' : ''}</div></span>
      <span class="pct">${tot || decided ? p + '%' : ''}</span></button>`;
  return `<div class="match" id="m-${m.id}">
    <div class="hd"><span class="lbl ${party}">${party === 'blue' ? 'Blue' : 'Red'} bracket</span><span class="lbl">${tot} vote${tot === 1 ? '' : 's'}</span></div>
    ${cand(a, av, pa)}
    <div class="bar ${party}"><b style="width:${pa}%"></b></div>
    ${cand(b, bv, pb)}
    <div class="meta"><span>${decided ? 'Final' : r.open ? 'Open' : 'Opens ' + fmtDate(r.opens_at)}</span><span>${decided ? (win ? esc(D.C[win].name) + ' advances' : 'No votes') : r.open ? left(r.closes_at) : ''}</span></div>
  </div>`;
}
function roundBlock(r, showAll) {
  const ms = showAll ? r.matchups : r.matchups;
  return `<section class="round"><div class="rh"><h2>${esc(r.name)}</h2><span class="note">${fmtDate(r.opens_at)} to ${fmtDate(r.closes_at)}</span></div>
    <div class="grid">${ms.map(m => matchCard(m, r)).join('')}</div></section>`;
}

const V = {
  now() {
    const open = D.rounds.filter(r => r.open);
    const next = D.rounds.find(r => !r.open && !r.past);
    if (!open.length) return `<h1>The field is set.</h1><p class="sub">${next ? 'Voting opens ' + fmtDate(next.opens_at) + '.' : 'No rounds scheduled.'}</p>${next ? roundBlock(next) : ''}`;
    const r = open[0];
    return `<div class="status"><i></i>Voting open · ${left(r.closes_at)}</div>
      <h1>Who advances?</h1><p class="sub">Tap a name to cast your vote. One vote per matchup. Results lock ${fmtDate(r.closes_at)} and the winners move on.</p>
      ${open.map(x => roundBlock(x)).join('')}`;
  },
  bracket() {
    const total = D.rounds.reduce((n, r) => n + r.matchups.reduce((k, m) => k + (+m.t.a_votes) + (+m.t.b_votes), 0), 0);
    const cands = Object.values(D.C);
    return `<h1>The bracket</h1><p class="sub">Every round, every matchup, from the first week to the final. Winners carry forward.</p>
      <div class="kpi"><div><span class="lbl">Contenders</span><div class="v">${cands.length}</div></div>
      <div><span class="lbl">Blue</span><div class="v">${cands.filter(c => c.party === 'blue').length}</div></div>
      <div><span class="lbl">Red</span><div class="v">${cands.filter(c => c.party === 'red').length}</div></div>
      <div><span class="lbl">Votes cast</span><div class="v">${total.toLocaleString()}</div></div></div>
      ${D.rounds.map(r => roundBlock(r)).join('') || '<div class="empty">No rounds yet</div>'}`;
  },
  results() {
    const done = D.rounds.filter(r => r.past || r.matchups.some(m => m.winner_id));
    return `<h1>Results</h1><p class="sub">Closed rounds and who advanced.</p>${done.map(r => roundBlock(r)).join('') || '<div class="empty">No round has closed yet. The first results show follows the first Sunday close.</div>'}`;
  },
  how() {
    return `<div class="how"><h1>How it works</h1>
      <p>Election Madness is a public bracket of the people most likely to run for president in 2028, run like a tournament. The bracket is hypothetical until candidates declare; when someone announces, they are locked in, and when someone rules it out, they are out.</p>
      <ol>
        <li>Each round opens Monday at 10 AM Central and closes Sunday at 9 PM Central.</li>
        <li>Pick one name in each matchup. One vote per matchup per device.</li>
        <li>The name with more votes at close advances. Ties go to the higher seed.</li>
        <li>Sunday night is the results show on <a href="https://instagram.com/ElectionMadness28" rel="noopener">@ElectionMadness28</a>.</li>
      </ol>
      <p>Blue and red brackets run side by side and never meet until the final. Seeds come from the preseason social polls.</p></div>`;
  },
};

function route() {
  const r = (location.hash.replace('#', '') || 'now').split('/')[0];
  const view = V[r] ? r : 'now';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.r === view));
  $('#main').innerHTML = V[view]();
}
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

async function vote(mid, cid) {
  const r = await fetch(SB + '/rest/v1/em_votes', { method: 'POST', headers: { ...H, Prefer: 'return=minimal' }, body: JSON.stringify({ matchup_id: mid, candidate_id: cid, voter: voterId() }) });
  if (r.status === 201) { remember(mid, cid); return true; }
  if (r.status === 409) { remember(mid, cid); toast('You already voted in this matchup'); return false; }
  const e = await r.text(); toast(/row-level security/i.test(e) ? 'This matchup is closed' : 'Vote did not go through'); return false;
}
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('.cand'); if (!b || b.disabled) return;
  b.disabled = true;
  if (await vote(b.dataset.m, b.dataset.c)) { toast('Vote counted'); await load(); route(); }
  else { b.disabled = false; }
});
window.addEventListener('hashchange', route);
load().then(route).catch(e => { $('#main').innerHTML = `<div class="empty">Could not load the bracket. ${esc(e.message)}</div>`; });
setInterval(() => load().then(route).catch(() => {}), 60000);
</script>
</body>
</html>
